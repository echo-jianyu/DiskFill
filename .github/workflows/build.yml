name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\DiskFill.sln

      - name: Build
        run: dotnet build .\DiskFill.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\DiskFill.sln -c Release --no-build --no-restore

      - name: Publish portable framework-dependent build
        run: dotnet publish .\DiskFill\DiskFill.csproj -c Release -f net48 --no-build -o .\publish

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: DiskFill-net48
          path: publish/
